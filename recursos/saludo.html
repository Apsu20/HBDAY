<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saludo</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎈</text></svg>">
    
    <!-- CDN de Ionic Framework para la etiqueta <ion-card> -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"></script>
    <script nomodule src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css" />

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="app"></div>

    <!-- Contenido inyectado dentro del template -->
    <template id="saludo-content">
       <div class="row">
            <div> <ion-card class="custom-card">
            <ion-card-header>
                <ion-card-title class="card-title font-cursive">¡Feliz Cumpleaños!</ion-card-title>
            </ion-card-header>

            <ion-card-content>
                <p class="saludo-text">
                    En este día tan especial, espero que disfrutes de cada momento rodeado de arte y alegría. ¡Que tengas un excelente año lleno de nuevos proyectos y metas cumplidas!
                </p>
            </ion-card-content>
            
        </ion-card> 
       </div>
       </div>
        
    </template>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const response = await fetch("../template.html");
                if (!response.ok) throw new Error("No se pudo cargar la plantilla base");
                
                const htmlText = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, "text/html");
                const baseTemplate = doc.getElementById("base-layout");
                const layoutClone = baseTemplate.content.cloneNode(true);

                // Personalizar el título
                layoutClone.getElementById("page-title").textContent = " 🤞 Un Saludo Especial 🤞";
                
                // Inyectar el ion-card en el contenedor principal
                const saludoContent = document.getElementById("saludo-content").content.cloneNode(true);
                layoutClone.getElementById("page-body").appendChild(saludoContent);

                document.getElementById("app").appendChild(layoutClone);
            } catch (error) {
                console.error("Error cargando la plantilla:", error);
            }
        });
    </script>
</body>
</html>
